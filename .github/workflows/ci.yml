name: Build the CI job for nodejs application
on:
  push:
    branches:
      - ci-branch
  pull_request:
    branches:
      - main


jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: List build directory
        run: ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-app-artifacts
          path: ./